# HTTP: redirect everything to HTTPS except the ACME challenge path
# (needed so certbot renewals keep working).
server {
    listen 80;
    server_name musistats.gay www.musistats.gay;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name musistats.gay www.musistats.gay;

    # Cert must cover both apex and www:
    #   certbot certonly --webroot -w /var/www/certbot -d musistats.gay -d www.musistats.gay
    ssl_certificate     /etc/letsencrypt/live/musistats.gay/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musistats.gay/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # API → Express container (Docker Compose internal DNS resolves `server`)
    location /api/ {
        proxy_pass http://server:3500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite content-hashes asset filenames, so these can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always revalidate so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA routing: any client-side route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
