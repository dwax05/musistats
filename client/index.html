<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b09" />
    <meta name="description" content="Your Spotify listening, measured over time." />
    <script>
      try {
        const savedTheme = localStorage.getItem("musistats-theme:v2");
        const legacyTheme = localStorage.getItem("musistats-theme");
        document.documentElement.dataset.theme = savedTheme && /^[a-z0-9-]+$/.test(savedTheme)
          ? savedTheme
          : legacyTheme === "light" ? "solarized-light" : "ucf-knights";
      } catch {
        document.documentElement.dataset.theme = "ucf-knights";
      }
    </script>
    <title>MusiStats</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
